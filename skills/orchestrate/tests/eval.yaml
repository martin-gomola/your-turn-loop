skill: orchestrate
description: |
  Verifies that the orchestrator resolves roles from the request, then standing instructions, then a single
  question; composes the companion skills instead of restating them; and stops only where the user must act.
cases:
  - name: roles_in_request
    prompt: |
      In Claude Code: orchestrate adding CSV export to the filtered table in this repo. Worker: codex,
      reviewer: gemini. The delegate-code, second-opinion, what-to-ask and your-turn-handoff skills are installed.
    rubric:
      expectations:
        - "Uses Codex as the worker and Gemini as the reviewer without asking about roles."
        - "Shows a short plan with each task's role, then briefs with what-to-ask and runs the code task through delegate-code."
        - "Runs the independent review through second-opinion with Gemini, not Codex or Claude."
        - "Stops before merging and ends with a task table and a your-turn-handoff block whose Next step asks to approve the merge."
      trajectory:
        in_order:
          - "show the plan table with roles"
          - "brief the task with what-to-ask"
          - "run delegate-code with codex"
          - "run second-opinion with gemini on the diff"
          - "report the task table"
        forbidden:
          - "ask the user to choose roles"
          - "merge before approval"

  - name: small_coupled_work_is_not_split
    prompt: |
      In Claude Code: orchestrate renaming `fetch_user` to `load_user` in src/users.py and its two callers in
      src/api.py. Worker: codex, reviewer: gemini.
    rubric:
      expectations:
        - "Plans one code task, because the parts are small and share files, instead of one delegation per file."
        - "Does not ask the user for approval to read files, write the brief or start the restricted delegation."

  - name: roles_from_instructions
    prompt: |
      In Codex: orchestrate the onboarding checklist feature. The repository's AGENTS.md contains the line
      "Your Turn roles: worker claude, reviewer gemini". No roles are named in this request.
    rubric:
      expectations:
        - "Takes Claude as the worker and Gemini as the reviewer from AGENTS.md and says where the roles came from."
        - "Does not ask the user to choose roles."
        - "Does not give any role to Codex, the agent it runs in."
        - "Runs the Gemini review through second-opinion for every code task, not only risky ones."

  - name: missing_roles
    prompt: |
      In Claude Code: orchestrate a redesign of the settings page with a new header illustration. No roles are
      named and the agent instructions say nothing about roles. Codex and Antigravity CLIs are installed.
    rubric:
      expectations:
        - "Proposes roles once before the first delegation: Codex as worker for routine code and Gemini as reviewer, the installed CLI that is neither the worker nor Claude."
        - "Plans the illustration through codex-image, since Claude Code has no image tool of its own, without calling it a role."
        - "Asks a single question about the roles instead of a questionnaire."
        - "Does not start a delegation before the user answers."

  - name: role_breaks_a_rule
    prompt: |
      In Cursor: orchestrate the cache refactor. Worker: cursor, reviewer: codex.
    rubric:
      expectations:
        - "Explains that Cursor can orchestrate but is never a worker, and asks which agent should be the worker."
        - "Does not silently substitute another worker."

  - name: worker_named_reviewer_omitted
    prompt: |
      In Claude Code: orchestrate the billing export and its audit log. Worker: codex. The agent instructions
      say nothing about roles. Codex and Antigravity CLIs are installed.
    rubric:
      expectations:
        - "Uses Codex as worker from the request and proposes Gemini as reviewer, the installed CLI that is neither the worker nor Claude."
        - "Waits once for the user to confirm the reviewer before the first delegation."
        - "Does not treat the missing reviewer as running without one."

  - name: local_task_stays_with_orchestrator
    prompt: |
      In Claude Code: orchestrate the search filter in src/search.ts with Codex as worker and Gemini as
      reviewer. Update CHANGELOG.md yourself.
    rubric:
      expectations:
        - "Marks the CHANGELOG.md task with kind local in the plan and does it itself."
        - "Delegates only the search filter task to Codex through delegate-code."

  - name: independent_tasks_continue_before_merge_pause
    prompt: |
      In Claude Code: orchestrate two independent tasks, CSV export in src/export.ts and a keyboard
      shortcut in src/keys.ts. Worker: codex, reviewer: gemini. Assume CSV export finishes review first
      and is ready to merge while the keyboard shortcut has not run yet.
    rubric:
      expectations:
        - "Does not stop after CSV export alone to wait for merge approval when the keyboard shortcut task is independent."
        - "Runs and reviews the independent keyboard shortcut task too, then pauses once with both ready tasks for the user to approve."

  - name: stuck_worker_triggers_one_diagnostic_consult
    prompt: |
      In Claude Code: orchestrate fixing the cache invalidation bug with Codex as worker and Gemini as
      reviewer. Codex fails the same cache test twice, even after one correction.
    rubric:
      expectations:
        - "Runs one bounded read-only diagnostic pass through second-opinion with Gemini on the brief, diff and error output before stopping and reporting to the user."
        - "Does not silently switch workers or start an open-ended fix loop."

threshold:
  pass_rate: 0.8
