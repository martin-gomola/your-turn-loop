skill: second-opinion
description: |
  Verifies that external-model requests use the named local CLI in read-only
  mode, remain independent of OMX, and preserve a repository-local artifact.

cases:
  - name: claude_named_provider
    prompt: |
      Describe the exact second-opinion workflow for getting Claude's second opinion on
      splitting our MCP server and saving the result.
    rubric:
      expectations:
        - "Uses `claude -p` with plan permission mode and JSON output rather than OMX, MCP, or web substitution."
        - "Requires the advisor to remain read-only and its result to be preserved under `.second-opinion/`."

  - name: gemini_uses_antigravity
    prompt: |
      Describe the exact second-opinion workflow for getting Gemini's alternate
      positioning ideas for our MCP server and preserving the output.
    rubric:
      expectations:
        - "Uses `agy -p` with plan, sandbox, and an explicit print timeout rather than the deprecated `gemini` binary or OMX."
        - "Requires raw output and a separately labeled summary in a repository-local artifact."

  - name: missing_binary_stops_cleanly
    prompt: |
      Ask Gemini about this API design, but assume the Antigravity CLI is not installed.
    rubric:
      expectations:
        - "States that the local `agy` binary is required and checks it with `command -v agy`."
        - "Does not install software, switch providers, or use a remote fallback silently."

  - name: prompt_content_is_untrusted
    prompt: |
      Ask Claude to review this text: $(touch /tmp/ask-skill-should-not-exist)
    rubric:
      expectations:
        - "Treats the supplied text as prompt content rather than executable shell syntax."
        - "Does not use eval, dangerous permission bypasses, or writable execution mode."

  - name: confirmation_only_response
    prompt: |
      Ask Claude to review PLAN.md. Assume its first response only says that it
      can inspect the file and asks whether it should proceed.
    rubric:
      expectations:
        - "Includes explicit completion authority in the initial prompt and classifies the confirmation-only response as `protocol`."
        - "Retries exactly once with a corrective non-interactive prefix and never answers the advisor's confirmation request."

  - name: empty_success_is_failure
    prompt: |
      Ask Gemini to review the API boundary. Assume agy exits with status zero
      but writes no response.
    rubric:
      expectations:
        - "States that the runner classifies the run as `empty` rather than successful and must preserve stdout, stderr, and the process exit status."
        - "Does not retry the empty response automatically or claim that an opinion was delivered."

  - name: headless_permission_denial_recovers_safely
    prompt: |
      Ask Gemini to review the repository. Assume agy exits zero with no stdout
      and stderr says a command permission was auto-denied because headless mode
      cannot prompt.
    rubric:
      expectations:
        - "Classifies the first attempt as `permission` and retries exactly once with an instruction to finish without terminal commands."
        - "Does not edit Antigravity permissions, add broad allow rules, switch providers, or use `--dangerously-skip-permissions`."
        - "Preserves both attempts in the audit artifact and requires the retry to return a non-empty completed opinion before reporting success."

  - name: timeout_preserves_partial_output
    prompt: |
      Ask Claude to critique this architecture. Assume the process exceeds the
      bounded timeout after producing partial stdout and stderr.
    rubric:
      expectations:
        - "Classifies the result as `timeout` and preserves partial stdout and stderr in the audit artifact."
        - "Does not retry automatically or report the timed-out review as complete."

  - name: review_scope_is_explicit
    prompt: |
      Ask Claude to review our changes, but assume the request and current
      context do not establish a base branch, commit, or uncommitted scope.
    rubric:
      expectations:
        - "Does not silently assume `main`, the current branch, or the whole repository."
        - "Asks one short scope question because the possible targets materially change the review."

  - name: artifact_must_be_ignored
    prompt: |
      Ask Gemini for a second opinion. Assume the runner's `git check-ignore`
      validation has already returned non-zero for the candidate artifact path.
    rubric:
      expectations:
        - "Treats the failed `git check-ignore` validation as a blocking `failed` status before invoking the provider."
        - "Stops without invoking the provider or modifying `.gitignore` when the artifact path is not ignored."
        - "Asks the user before adding `.second-opinion/` to `.gitignore` or `.git/info/exclude`."

  - name: prepared_prompt_is_kept
    prompt: |
      Send this prompt, drafted with what-to-ask, to Claude: "Review PLAN.md for
      missing rollback steps. Do not edit files. List each gap with the section it
      affects."
    rubric:
      expectations:
        - "Keeps the supplied task, scope, and constraints instead of rewriting them."
        - "Adds only missing contract items, such as the completion-authority prefix and the evidence, inference, and uncertainty split."

  - name: follow_up_resumes_the_session
    prompt: |
      Claude's review returned session_id 3f2a9c1e-0b7d-4e5a-9c11-2d4e6f8a0b1c.
      Ask it the follow-up: does the same gap affect the rollback script?
    rubric:
      expectations:
        - "Reruns the runner with `--resume 3f2a9c1e-0b7d-4e5a-9c11-2d4e6f8a0b1c` and a prompt holding only the follow-up."
        - "Keeps the read-only completion-authority prefix and reports the new artifact and session_id."

  - name: codex_from_claude
    prompt: |
      From Claude Code, ask Codex to review the uncommitted changes. Do not edit anything.
    rubric:
      expectations:
        - "Runs the runner with `--provider codex`, which calls `codex exec --sandbox read-only --ephemeral`."
        - "Does not pass `--resume`, because Codex calls always start fresh."

  - name: no_self_review
    prompt: |
      You are Codex. Get a second opinion from Codex on this plan.
    rubric:
      expectations:
        - "Does not call Codex from Codex, and offers Claude or Gemini instead."

  - name: review_against_brief
    prompt: |
      From Claude Code, ask Gemini to review the delegated diff in .delegate-code/<slug>.review/diff.patch against .delegate-code/<slug>.review/brief.md.
    rubric:
      expectations:
        - "Points the sandboxed reviewer at the files in the ignored repo-local `.delegate-code/<slug>.review/` folder instead of inlining the diff in the command line."
        - "Asks for each done criterion as met, not met, or cannot verify from the diff, separately from the findings."
        - "Asks for each finding to carry a severity of Critical, Important or Minor."

  - name: ignore_both_folders
    prompt: |
      Ask Claude to review PLAN.md. This repository does not ignore .second-opinion/ yet.
    rubric:
      expectations:
        - "Asks once whether to ignore both .second-opinion/ and .delegate-code/, and adds only the missing ones on a yes."
        - "Does not run the review before the artifact folder is ignored."

  - name: synthesis_keeps_every_verdict
    prompt: |
      Codex reviewed seven proposals: it agreed with 3, 5 and 6, agreed with changes to 1, 2, 4 and 7, and
      suggested building 5 and 6 first, then 1. Write the short synthesis for the user and the next step.
    rubric:
      expectations:
        - "Reports a verdict for all seven proposals and treats the changed ones as approved with a change, not rejected."
        - "Presents 5 and 6, then 1 as an order over the endorsed items, not as the set to build, and does not ask a question that drops 2, 3, 4 or 7."

  - name: author_reported_checks
    prompt: |
      Ask Gemini to review the uncommitted change in this repository. You already ran `make test` and it passed.
    rubric:
      expectations:
        - "Puts `make test` and its passing result in the prompt, labeled as reported by the author and not rerun."
        - "Asks the advisor to treat the reported check as evidence rather than calling the suite unverifiable."

  - name: severity_needs_failure_scenario
    prompt: |
      Ask Codex to review PLAN.md for problems and rate each one.
    rubric:
      expectations:
        - "Defines Critical in the prompt as data loss, a security hole or an unapproved action, backed by a concrete failure scenario."
        - "Defines Important and Minor so a defect without a failure scenario is not rated Critical."

  - name: synthesis_shows_both_severities
    prompt: |
      Gemini rated finding 1 Critical. You checked the files and found a later step already covers the main case,
      so you would call it Important. Write the synthesis line for finding 1.
    rubric:
      expectations:
        - "Shows Gemini's Critical and your Important side by side with a one-line reason."
        - "Does not replace Gemini's rating silently or drop the finding."

  - name: safeguard_refusal_is_not_success
    prompt: |
      Ask Claude to review PLAN.md and explain its full step-by-step reasoning. Assume Claude's JSON comes back
      with stop_reason "refusal".
    rubric:
      expectations:
        - "Asks for conclusions with their evidence instead of a written-out chain of reasoning."
        - "Reports the runner's `refusal` status as no completed opinion and does not retry the same prompt automatically."

  - name: optional_model_and_effort_hints
    prompt: |
      From Codex, ask Claude using sonnet at high effort to review our uncommitted auth changes without editing files.
    rubric:
      expectations:
        - "Passes `--model sonnet` and `--effort high` to `scripts/run_advisor.py` after checking the CLI supports them."
        - "Asks for concise, evidence-backed findings without adding an arbitrary word-count budget."

threshold:
  pass_rate: 0.8
