skill: codex-image
should_trigger:
  - "From Cursor, use Codex CLI to generate a 1200x630 social preview from these two references."
  - "Claude can't create the project illustration here. Delegate it to Codex and save the PNG in an ignored work folder."
  - "Use $codex-image to create the app icon using this screenshot as a visual reference."
  - "Ask the Codex CLI image tool to make a product hero image and verify the final dimensions."
  - "Create a 512px app icon for this project and save it in assets/."
  - "Generate an illustration of a fox reading a map for the empty state."
  - "Make a 1200x630 social preview image for the README."
  - "I'm in Gemini and need a background image for the landing page; you can't draw, so get it made."
should_not_trigger:
  - "Write a better prompt for a poster, but don't generate anything."
  - "Use the available native image-generation tool to create this landscape."
  - "Review the generated image and tell me whether its colors match the brief."
  - "Install the Codex CLI and configure my API credentials so image generation will work."
  - "Create a travel poster using the saved paper-diorama style."
  - "Crop this screenshot to show the settings panel."
threshold:
  min_tpr: 0.85
  max_fpr: 0.1
