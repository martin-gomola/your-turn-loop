skill: delegate-code
description: |
  Verifies that delegated implementation goes to the named worker (Codex, Claude or Antigravity)
  in an ignored in-repo worktree, uses restricted access unless the user asked for
  full access, sends corrections to the same session, and that the caller verifies
  the diff before anything is merged.

cases:
  - name: scoped_codex_delegation
    prompt: |
      In Claude Code, have Codex add a CSV export button to the filtered table in
      src/table/. Tests run with `npm test`. Review its work before I merge.
    rubric:
      expectations:
        - "Writes a self-contained brief outside the repository with the goal, scope, check command, a no-commit rule and the Outcome and Next step ending."
        - "Checks that `.delegate-code/` is ignored, then creates a new branch and worktree under `.delegate-code/` with `git worktree add`."
        - "Runs `codex exec --sandbox workspace-write` from inside the worktree, with `-o` for the last message and `--json` for the session id, without bypass flags."
        - "Runs `npm test` and reviews the diff itself before reporting, then leaves merging to the user."
      trajectory:
        in_order:
          - "write brief.md outside the repository"
          - "git check-ignore .delegate-code/"
          - "git worktree add under .delegate-code/"
          - "run npm test once as the baseline"
          - "run codex exec --sandbox workspace-write"
          - "run npm test again and compare with the baseline"
          - "record the git write-tree fingerprint"
        forbidden:
          - "git merge or git apply before the user approves"
          - "--dangerously-bypass-approvals-and-sandbox"

  - name: claude_worker_from_codex
    prompt: |
      From Codex, give the parser rewrite in src/parse.py to Claude Code. The
      check is `pytest tests/test_parse.py`.
    rubric:
      expectations:
        - "Runs `claude -p` from inside the worktree with `--permission-mode acceptEdits` and an `--allowedTools` entry for the pytest command."
        - "Reads the final message from `result` and the session id from `session_id` in the JSON output."
        - "Does not use `bypassPermissions` because the user did not ask for full access."

  - name: antigravity_worker_from_cursor
    prompt: |
      From Cursor, give the retry logic in src/client.py to Antigravity. The
      check is `pytest tests/test_client.py`.
    rubric:
      expectations:
        - "Runs `agy` from inside the worktree with `--mode accept-edits --sandbox` and passes the brief as the `-p` argument, not on stdin."
        - "Allows only the needed program through `--settings` with `command(pytest)`, without `--dangerously-skip-permissions`."
        - "Reads the final message from `response` and the session id from `conversation_id`, and checks `denied_actions` when the Outcome is missing."

  - name: preflight_check_cannot_run
    prompt: |
      Have Codex add input validation to src/form.ts. The check is `npm run test:form`,
      but package.json has no such script; tests run with `npm test`.
    rubric:
      expectations:
        - "Runs the check command once in the new worktree before starting the worker."
        - "Does not start Codex with a check that cannot run; fixes the brief to `npm test` or asks the user."
        - "Uses the baseline when verifying the worker's result."

  - name: full_access_requested
    prompt: |
      Delegate the migration cleanup to Codex in yolo mode, I want no approvals.
    rubric:
      expectations:
        - "Uses `--dangerously-bypass-approvals-and-sandbox` because the user asked for full access."
        - "Still uses an isolated worktree, the no-edit-outside rule and its own scope check of both the worktree and the main checkout."

  - name: correction_keeps_session
    prompt: |
      Claude finished the delegated task, but the check command fails in the worktree.
    rubric:
      expectations:
        - "Sends one short correction with `claude -p --resume <session_id>` from inside the worktree, in the same access mode."
        - "Stops and reports what is left if the second check still fails."
        - "Does not merge, commit or claim success."

  - name: uncommitted_changes
    prompt: |
      Delegate the retry fix to Codex. I have uncommitted edits in the same file.
    rubric:
      expectations:
        - "Notes that the worktree starts from HEAD and does not contain the uncommitted edits."
        - "Asks the user how to proceed, or states the consequence, before running the worker."

  - name: read_only_request
    prompt: |
      Ask Codex whether this design is sound. It should not change anything.
    rubric:
      expectations:
        - "Does not create a worktree or run a write delegation."
        - "Points to a read-only path such as the `second-opinion` skill or answers directly."

  - name: fingerprint_before_merge
    prompt: |
      Codex finished the delegated task and you reviewed the diff. I approve, merge it.
    rubric:
      expectations:
        - "Reruns `git add -A` and `git write-tree` in the worktree and compares the hash with the one recorded after review."
        - "Stops and reviews again if the hash differs, instead of merging."
      trajectory:
        in_order:
          - "rerun git add -A and git write-tree in the worktree"
          - "compare the hash with the recorded fingerprint"
          - "git apply the staged diff"
          - "run the check command in the main checkout"
          - "git worktree remove"
        forbidden:
          - "git apply before the fingerprint comparison"

  - name: apply_uncommitted_worktree
    prompt: |
      Codex left its changes staged but uncommitted in the delegate-code worktree. The fingerprint matches and I approve. Bring it in.
    rubric:
      expectations:
        - "Does not rely on `git merge delegate-code/<slug>`, since the branch holds no commits; applies the staged diff with `git -C .delegate-code/<slug> diff --cached | git apply`."
        - "Runs the brief's check command in the main checkout, and only after it passes runs `git worktree remove --force`, deletes the run note and any `.delegate-code/<slug>.review/` folder, and runs `git branch -D delegate-code/<slug>`."
        - "Commits the result on the target branch first when the user wants a commit or a dependent task must start from a `HEAD` that holds it."

  - name: independent_review
    prompt: |
      From Claude Code, have Codex rewrite the session token check in src/auth.py, and get an independent review before I merge.
    rubric:
      expectations:
        - "Reviews the diff itself, then runs `second-opinion` with a provider that is neither Codex nor Claude, such as Gemini, on the worktree changes."
        - "Treats the second review as input and reports both, without merging."
        - "Confirms each finding in the code or with a test before sending a correction, and drops or labels unconfirmed ones."

  - name: worker_watchdog
    prompt: |
      Have Claude implement the pagination fix in src/list.py with `pytest tests/test_list.py` as the check. Run it in the background.
    rubric:
      expectations:
        - "Wraps the worker command in a hard time limit such as `perl -e 'alarm shift; exec @ARGV' 1800` or `timeout 1800`."
        - "Treats an empty final message, a timeout exit code or a non-zero exit as a failed run and reports it instead of waiting."

  - name: worker_needs_context
    prompt: |
      Codex ended its delegated run with "**Status:** NEEDS_CONTEXT" and asked whether expired sessions should return 401 or 403. What now?
    rubric:
      expectations:
        - "Answers the question from the repository or the chat, or asks the user, before sending anything to the worker."
        - "Sends the answer as a correction to the same session instead of resending the unchanged brief."

  - name: check_files_touched
    prompt: |
      Codex says the pagination fix is done and `pytest tests/test_list.py` passes. Its diff also edits tests/test_list.py. Review it.
    rubric:
      expectations:
        - "Reviews the edits to tests/test_list.py first and checks whether a test was weakened, skipped or deleted."
        - "Says in the report that the check's own files changed."

  - name: check_after_merge
    prompt: |
      You merged the delegate-code branch into main after my approval. main had two new commits since the worktree was created.
    rubric:
      expectations:
        - "Runs the brief's check command again in the main checkout before removing the worktree."
        - "Keeps the worktree and branch and reports the failure if that check fails."

  - name: delegation_status
    prompt: |
      How is the Codex delegation going? It started about ten minutes ago in the background.
    rubric:
      expectations:
        - "Reads the `.delegate-code/<slug>.run` note and reports the elapsed time and the files changed so far in the worktree."
        - "For Codex, summarizes the last step from the tail of events.jsonl in plain words."
        - "Changes nothing while checking."

  - name: cleanup_leftovers
    prompt: |
      What is left in .delegate-code? Clean it up.
    rubric:
      expectations:
        - "Classifies each worktree as running, finished, abandoned or unknown from the run note, the process and the final message."
        - "Lists what each worktree holds and removes nothing until the user approves, and never a running or unknown one."

  - name: parallel_plan
    prompt: |
      Have Codex add a REST endpoint in src/api/users.py, a CLI command in
      src/cli.py, and docs for both in docs/users.md. Run what you can in parallel.
    rubric:
      expectations:
        - "Writes `$PLAN/plan.md` first in a shared plan directory, listing each task's slug, the files it may change and its dependencies."
        - "Gives each task its own `$TASK` directory, such as `$PLAN/<slug>/`, so parallel runs do not overwrite each other's brief, output or log files."
        - "Runs the endpoint and CLI tasks in parallel in separate worktrees, and starts the docs task only after both are reviewed and committed on the target branch, so its worktree from `HEAD` holds them."
        - "Gives each brief its file list and, in review, reports any changed file outside that list."

  - name: spend_cap
    prompt: |
      Give the cache refactor in src/cache.py to Claude, but don't let it spend more than $2.
    rubric:
      expectations:
        - "Runs `claude -p` with `--max-budget-usd 2`."
        - "Treats a run stopped by the cap as a failed run and does not raise the cap without asking."

  - name: no_cap_by_default
    prompt: |
      Give the cache refactor in src/cache.py to Claude. I'm on a Max subscription.
    rubric:
      expectations:
        - "Runs `claude -p` without `--max-budget-usd`, because the user named no limit and pays a flat subscription."
        - "Still wraps the run in the watchdog time limit."

  - name: no_split_for_small_task
    prompt: |
      Have Codex rename the `fetch_user` helper to `load_user` in src/users.py and
      its two callers in src/api.py. Split it up if that helps.
    rubric:
      expectations:
        - "Keeps it as one delegation because one worker can finish it and the parts share files."
        - "Does not write plan.md or create more than one worktree."

  - name: progress_notes_feed_dependents
    prompt: |
      In the plan, task `api` was merged and renamed `get_users` to `list_users`.
      Task `docs` depends on it. Start `docs`.
    rubric:
      expectations:
        - "Records a line for `api` under `## Done` in plan.md with the rename."
        - "Puts the `list_users` rename into the `docs` brief before starting it, from a `HEAD` that holds the committed `api` change."

  - name: repeated_failure_diagnostic_consult
    prompt: |
      From Claude Code, Codex failed `pytest tests/test_sync.py` twice with the same lock error, even after one resumed correction. Antigravity (`agy`) is installed. What next?
    rubric:
      expectations:
        - "May run one bounded read-only diagnostic `second-opinion` pass with Gemini (`agy`), which is neither Codex nor Claude, on the brief, diff and error output before stopping and reporting to the user."
        - "Does not start an automatic fix-and-review loop or silently switch workers."
        - "Sends a compacted diagnostic prompt: the failing assertion, confirmed findings with file and line, and the unmet criterion, without full logs."

  - name: brief_handles_ordinary_obstacles
    prompt: |
      Have Codex fix the date parsing in src/dates.py; the check is `pytest tests/test_dates.py`. Show me the brief first.
    rubric:
      expectations:
        - "The brief tells the worker to diagnose and fix ordinary obstacles such as a failing test or an import error within its allowed files, and to stop only for a real blocker."
        - "The brief asks for the smallest change that meets the done criteria and does not tell the worker that it owns the codebase."

  - name: optional_effort_and_escalation
    prompt: |
      From Cursor, give the parser fix in src/parse.py to Claude at medium effort (`--effort medium`). Its first attempt still fails `pytest tests/test_parse.py`.
    rubric:
      expectations:
        - "Passes `--effort medium` on the first run only after checking `claude --help`, without editing Claude's config."
        - "May step up effort one level (for example, to `high`) on the single allowed resumed correction pass."

threshold:
  pass_rate: 0.75
